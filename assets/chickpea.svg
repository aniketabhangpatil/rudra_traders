  <path d="M 45 42 C 45 32, 53 30, 56 36 C 65 37, 72 48, 68 62 C 65 72, 48 74, 40 64 C 35 56, 38 46, 45 42 Z" fill="url(#chanaGrad1)" filter="url(#chanaShadow)" stroke="#78350f" stroke-width="1.2"/>
