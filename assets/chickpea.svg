  <circle cx="66" cy="62" r="3.5" fill="#ffedd5" opacity="0.5"/>

  <!-- Chickpea 3 (Lower left) -->
  <path d="M 32 64 C 34 56, 42 54, 46 59 C 52 62, 55 72, 51 81 C 47 88, 33 89, 27 81 C 23 74, 26 66, 32 64 Z" fill="url(#chanaGrad1)" filter="url(#chanaShadow)" stroke="#78350f" stroke-width="1.2"/>
  
