  <circle cx="48" cy="48" r="3" fill="#fef08a" opacity="0.5"/>

  <!-- Chickpea 2 (Foreground right) -->
  <path d="M 62 55 C 64 45, 73 42, 78 48 C 86 52, 90 64, 85 76 C 80 86, 62 87, 55 77 C 50 68, 54 58, 62 55 Z" fill="url(#chanaGrad2)" filter="url(#chanaShadow)" stroke="#7c2d12" stroke-width="1.2"/>
