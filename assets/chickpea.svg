  <path d="M 75 35 Q 85 24 94 20" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="88" cy="22" rx="4" ry="7" transform="rotate(30 88 22)" fill="#22c55e"/>
  <ellipse cx="80" cy="28" rx="4" ry="6" transform="rotate(-40 80 28)" fill="#16a34a"/>
