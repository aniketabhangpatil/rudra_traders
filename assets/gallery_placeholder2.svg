<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="goldPlate2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#bgGrad2)"/>
  <rect x="20" y="20" width="560" height="360" rx="8" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,6"/>
  
  <!-- Quality & Moisture Inspection graphic -->
  <g transform="translate(190, 60)">
    <!-- Inspection Tray -->
    <ellipse cx="110" cy="115" rx="100" ry="35" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="110" cy="113" rx="92" ry="30" fill="#f8fafc"/>
    <!-- Samples of grains on tray -->
    <circle cx="80" cy="110" r="5" fill="#ca8a04"/>
    <circle cx="95" cy="115" r="4.5" fill="#eab308"/>
    <circle cx="110" cy="112" r="5" fill="#ca8a04"/>
    <circle cx="125" cy="116" r="4" fill="#a16207"/>
    <circle cx="140" cy="110" r="5" fill="#eab308"/>
    <!-- Moisture Meter Device -->
    <rect x="75" y="20" width="70" height="65" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
    <rect x="85" y="28" width="50" height="25" rx="3" fill="#064e3b"/>
    <text x="110" y="45" font-family="monospace" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">9.8% OK</text>
    <path d="M 105 85 L 105 105" stroke="#64748b" stroke-width="4"/>
    <path d="M 115 85 L 115 105" stroke="#64748b" stroke-width="4"/>
  </g>

  <!-- Labels -->
  <rect x="60" y="255" width="480" height="36" rx="6" fill="url(#goldPlate2)"/>
  <text x="300" y="279" font-family="'Mukta', sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">
    धान्य गुणवत्ता व ओलावा (Moisture) तपासणी
  </text>
  
  <text x="300" y="318" font-family="sans-serif" font-size="14" font-weight="600" fill="#a7f3d0" text-anchor="middle">
    Transparent Grain Quality &amp; Moisture Inspection
  </text>
  
  <rect x="150" y="340" width="300" height="24" rx="12" fill="#166534" stroke="#4ade80" stroke-width="1"/>
  <text x="300" y="356" font-family="sans-serif" font-size="11" font-weight="500" fill="#ecfdf5" text-anchor="middle">
    📷 व्यवसाय छायाचित्र (ॲडमिन पॅनेलमधून नवीन फोटो जोडा)
  </text>
</svg>
