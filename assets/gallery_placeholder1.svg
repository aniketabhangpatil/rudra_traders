<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#bgGrad1)"/>
  <rect x="20" y="20" width="560" height="360" rx="8" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6,6"/>
  
  <!-- Facility Graphic: Certified Scale / Platform -->
  <g transform="translate(180, 70)">
    <!-- Base platform -->
    <rect x="20" y="110" width="200" height="18" rx="4" fill="#334155"/>
    <rect x="10" y="128" width="220" height="12" rx="3" fill="#1e293b"/>
    <!-- Yellow weight markings -->
    <rect x="30" y="114" width="180" height="4" fill="#fbbf24" opacity="0.8"/>
    <!-- Digital Indicator -->
    <rect x="85" y="40" width="70" height="45" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
    <rect x="92" y="47" width="56" height="24" rx="3" fill="#022c22"/>
    <text x="120" y="65" font-family="monospace" font-size="14" font-weight="bold" fill="#34d399" text-anchor="middle">5,480 KG</text>
    <rect x="117" y="85" width="6" height="25" fill="#64748b"/>
    <!-- Crop Bags on platform -->
    <ellipse cx="60" cy="98" rx="28" ry="16" fill="#b45309"/>
    <ellipse cx="180" cy="98" rx="28" ry="16" fill="#d97706"/>
    <ellipse cx="120" cy="94" rx="32" ry="18" fill="#ca8a04"/>
  </g>

  <!-- Marathi & English Labels -->
  <rect x="60" y="255" width="480" height="36" rx="6" fill="url(#goldPlate)"/>
  <text x="300" y="279" font-family="'Mukta', sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">
    इलेक्ट्रॉनिक वजन काटा व शेतीमाल संकलन केंद्र
  </text>
  
  <text x="300" y="318" font-family="sans-serif" font-size="14" font-weight="600" fill="#a7f3d0" text-anchor="middle">
    Certified Electronic Weighbridge &amp; Grain Intake Station
  </text>
  
  <rect x="150" y="340" width="300" height="24" rx="12" fill="#065f46" stroke="#34d399" stroke-width="1"/>
  <text x="300" y="356" font-family="sans-serif" font-size="11" font-weight="500" fill="#ecfdf5" text-anchor="middle">
    📷 व्यवसाय छायाचित्र (ॲडमिन पॅनेलमधून नवीन फोटो जोडा)
  </text>
</svg>
