<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="soyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="podGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#fef9c3" stroke="#eab308" stroke-width="2.5" opacity="0.6"/>
  <!-- Soybean Pod -->
  <path d="M 30 75 C 38 45, 75 35, 95 38 C 88 58, 65 82, 30 75 Z" fill="url(#podGrad)" filter="url(#shadow)"/>
  <!-- Individual Soybeans -->
  <circle cx="48" cy="60" r="14" fill="url(#soyBg)" stroke="#a16207" stroke-width="1.5" filter="url(#shadow)"/>
  <ellipse cx="46" cy="56" rx="3.5" ry="5" fill="#fef9c3" opacity="0.6"/>
  <circle cx="49" cy="62" r="1.5" fill="#78350f" opacity="0.4"/>
  
  <circle cx="70" cy="50" r="15" fill="url(#soyBg)" stroke="#a16207" stroke-width="1.5" filter="url(#shadow)"/>
  <ellipse cx="68" cy="46" rx="4" ry="5.5" fill="#fef9c3" opacity="0.6"/>
  <circle cx="71" cy="52" r="1.5" fill="#78350f" opacity="0.4"/>

  <circle cx="58" cy="74" r="13" fill="url(#soyBg)" stroke="#a16207" stroke-width="1.5" filter="url(#shadow)"/>
  <ellipse cx="56" cy="70" rx="3" ry="4.5" fill="#fef9c3" opacity="0.6"/>
  
  <!-- Leaf Stem -->
  <path d="M 95 38 Q 102 30 106 24" fill="none" stroke="#4d7c0f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 98 32 Q 106 32 108 26 Q 100 24 98 32 Z" fill="#65a30d"/>
</svg>
