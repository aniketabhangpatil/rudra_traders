<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="goldPlate3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#bgGrad3)"/>
  <rect x="20" y="20" width="560" height="360" rx="8" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="6,6"/>
  
  <!-- Direct Settlement & Billing graphic -->
  <g transform="translate(180, 60)">
    <!-- Computer Screen / Bill Printer -->
    <rect x="30" y="30" width="120" height="85" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="38" y="38" width="104" height="69" rx="3" fill="#f8fafc"/>
    <rect x="45" y="46" width="90" height="6" fill="#0284c7"/>
    <rect x="45" y="58" width="60" height="4" fill="#94a3b8"/>
    <rect x="45" y="66" width="70" height="4" fill="#94a3b8"/>
    <rect x="45" y="74" width="50" height="4" fill="#94a3b8"/>
    <rect x="45" y="86" width="40" height="8" fill="#16a34a"/>
    <text x="70" y="93" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">PAID</text>
    
    <!-- Cash / Bank Transfer Symbol -->
    <circle cx="180" cy="70" r="32" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <text x="180" y="80" font-family="'Mukta', sans-serif" font-size="32" font-weight="bold" fill="#78350f" text-anchor="middle">₹</text>
  </g>

  <!-- Labels -->
  <rect x="60" y="255" width="480" height="36" rx="6" fill="url(#goldPlate3)"/>
  <text x="300" y="279" font-family="'Mukta', sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">
    शेतकरी हिशोब, संगणकीकृत पावती व तात्काळ पेमेंट
  </text>
  
  <text x="300" y="318" font-family="sans-serif" font-size="14" font-weight="600" fill="#ccfbf1" text-anchor="middle">
    Transparent Bill Settlement &amp; Direct Bank/Cash Payment
  </text>
  
  <rect x="150" y="340" width="300" height="24" rx="12" fill="#115e59" stroke="#2dd4bf" stroke-width="1"/>
  <text x="300" y="356" font-family="sans-serif" font-size="11" font-weight="500" fill="#ecfdf5" text-anchor="middle">
    📷 व्यवसाय छायाचित्र (ॲडमिन पॅनेलमधून नवीन फोटो जोडा)
  </text>
</svg>
